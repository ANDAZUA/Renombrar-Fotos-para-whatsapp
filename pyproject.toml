[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp-photo-renamer"
version = "0.1.0"
description = "Batch rename WhatsApp exported photos using their captions"
requires-python = ">=3.10"

[project.scripts]
whatsapp-photo-renamer = "whatsapp_photo_renamer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
